    function showSecondDropdown() {
        const selectedValue = document.getElementById('serv1').value;

        const dd1a = document.getElementById('serv1a');

        const dd2 = document.getElementById('serv2');

        const c2a = document.getElementById('serv2ac');
        const c3a = document.getElementById('serv3ac');
        const c4a = document.getElementById('serv4ac');

        const c2 = document.getElementById('serv2c');
        const c3 = document.getElementById('serv3c');
        const c4 = document.getElementById('serv4c');

        dd2.innerHTML = '<option value="">-- Select Additional Service --</option>';

        if (selectedValue) {
            c1a.style.display = 'block';
            c2.style.display = 'block';
            c2a.style.display = 'none';
            c3.style.display = 'none';
            c3a.style.display = 'none';
            c4.style.display = 'none';
            c4a.style.display = 'none';

            dd1.style.borderRadius = "20px 20px 5px 5px";

            const remainingServices = services.filter(service => service.value !== selectedValue);

            remainingServices.forEach(service => {
                const option = document.createElement('option');
                option.value = service.value;
                option.textContent = service.text;
                dd2.appendChild(option);
            });
            dd1a.innerHTML = `<option value="">-- Select Service Description --</option>`;
            for (let i = 0; i < servv.length; i++) {
