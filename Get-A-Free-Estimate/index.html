<body>
    <div id="tag" style="display: none;">nform</div>
    <nav id="navv">
    </nav>
    <div class="paybox" id="paybox">
    <div class="pbexp">
        <br><br>
    <h1>GET A FREE ESTIMATE</h1>
    <p>
        Share your details below to get a personalized quote

        <br><br>
        <b>Special Offer: Book on Sunday for 10% off—don’t miss out!</b>
    </p>
    </div>
    <form id="contact-form">

    <input type="text" name="_honey" style="display: none;">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="/Success">

    <label for="Full&nbsp;Name">Full Name <span>*</span></label>
    <input type="text" name="name" id="" placeholder="eg. Kareem" required>

    <label for="Phone">Phone Number</label>
    <input type="number" name="phone" id="" placeholder="eg. 09012345678">

    <label for="E-mail">Email Address <span>*</span></label>
    <input type="email" name="email" id="" placeholder="eg. name@example.com" required>
    
    <label for="Service"><b>What service do you need?</b> <span>*</span></label>
    <div class="addserv">
        <select name="service" id="serv1" onchange="showSecondDropdown()" required>
            <option value="">-- Select a Service --</option>
            <option value="Moving In & Out Assistance">Moving In & Out Assistance</option>
            <option value="Cleaning & Organizing">Cleaning & Organizing</option>
            <option value="Curtains & Window Blinds ">Curtains & Window Blinds </option>
            <option value="Furniture Making and Setup">Furniture Making and Setup</option>
            <option value="Furniture Repairs">Furniture Repairs</option>
            <option value="Electrical">Electrical</option>
            <option value="Painting">Painting</option>
            <option value="Plumbing">Plumbing</option>
            <option value="AC Installation & Servicing">AC Installation & Servicing</option>
            <option value="Solar Installation">Solar Installation</option>
            <option value="Home Appliance Repairs & Installation">Home Appliance Repairs & Installation</option>
            <option value="Generator Fixes & Servicing">Generator Fixes & Servicing</option>
        </select>
        <div id="serv2c" style="display: none;">
            <select name="servicedesc" id="serv2" required>
            </select>
        </div>
    </div>
    <label for="msg">Job Details <span>*</span></label>
    <textarea name="message" id="" cols="30" rows="10" placeholder="Message" required></textarea>

    <label for="date">Preferred Date and Time <span>*</span></label>
    <input type="date" name="date" id="" required>
    <input type="time" name="time" id="" required>
    
    <label for="date">Upload an image of the job site, furniture or appliance</label>
    <input type="file" name="file" class="file-in" accept="image/*">

    <div class="tac">
        <input type="checkbox" name="tac" id="terms" required>
        <label for="Ts&Cs">By submitting this form, you confirm that you have read and agree to <a href="/Terms-and-Conditions/">Terms of Use</a> and <a href="/Terms-and-Conditions#privacy">Privacy Policy</a>.</label>
    </div>

    <script>
        const sMove = [
            "Moving In & Out Assistance",
            { value: 'Single Room Moving', text: 'Single Room Moving' },
            { value: 'Apartment Moving', text: 'Apartment Moving' },
            { value: 'Office Relocation', text: 'Office Relocation' },
            { value: 'Packing & Unpacking', text: 'Packing & Unpacking' },
            { value: 'Furniture Disassembly & Assembly', text: 'Furniture Disassembly & Assembly' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sPaint = [
            "Painting",
            { value: '1 Room', text: '1 Room' },
            { value: '2 Rooms', text: '2 Rooms' },
            { value: 'Apartment', text: 'Apartment' },
            { value: 'Full House', text: 'Full House' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sElec = [
            "Electrical",
            { value: 'Socket Repair', text: 'Socket Repair' },
            { value: 'Lighting Installation', text: 'Lighting Installation' },
            { value: 'Tracing & Fix (Troubleshooting)', text: 'Tracing & Fix (Troubleshooting)' },
            { value: 'Full Wiring (Residential)', text: 'Full Wiring (Residential)' },
            { value: 'Full Wiring (Commercial)', text: 'Full Wiring (Commercial)' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sPlumb = [
            "Plumbing",
            { value: 'Leak Repair', text: 'Leak Repair' },
            { value: 'Pipe Fitting', text: 'Pipe Fitting' },
            { value: 'Bathroom Installation', text: 'Bathroom Installation' },
            { value: 'Kitchen Installation', text: 'Kitchen Installation' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sCurt = [
            "Curtains & Window Blinds ",
            { value: '1 Window', text: '1 Window' },
            { value: '2-5 Windows', text: '2-5 Windows' },
            { value: 'Full Apartment', text: 'Full Apartment' },
            { value: 'Office/Commercial Space', text: 'Office/Commercial Space' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sClean = [
            "Cleaning & Organizing",
            { value: '1 Bedroom Apartment', text: '1 Bedroom Apartment' },
            { value: '2-3 Bedroom Apartment', text: '2-3 Bedroom Apartment' },
            { value: 'Duplex/House', text: 'Duplex/House' },
            { value: 'Office/Commercial Cleaning', text: 'Office/Commercial Cleaning' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sAc = [
            "AC Installation & Servicing",
            { value: '1 HP', text: '1 HP' },
            { value: '1.5 HP', text: '1.5 HP' },
            { value: '2 HP', text: '2 HP' },
            { value: 'Servicing (Any Size)', text: 'Servicing (Any Size)' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sSolar = [
            "Solar Installation",
            { value: 'Small Setup (1-2 Rooms)', text: 'Small Setup (1-2 Rooms)' },
            { value: 'Medium Setup (Apartment)', text: 'Medium Setup (Apartment)' },
            { value: 'Large Setup (Office/Duplex)', text: 'Large Setup (Office/Duplex)' },
            { value: 'Custom Solar System', text: 'Custom Solar System' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sHome = [
            "Home Appliance Repairs & Installation",
            { value: 'Washing Machine', text: 'Washing Machine' },
            { value: 'Refrigerator', text: 'Refrigerator' },
            { value: 'Water Heater', text: 'Water Heater' },
            { value: 'Oven/Gas Cooker', text: 'Oven/Gas Cooker' },
            { value: 'Generator', text: 'Generator' },
            { value: 'DSTV Installation', text: 'DSTV Installation' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sFurnM = [
            "Furniture Making and Setup",
            { value: 'Sofa', text: 'Sofa' },
            { value: 'Wardrobe', text: 'Wardrobe' },
            { value: 'Bed', text: 'Bed' },
            { value: 'Office Furniture', text: 'Office Furniture' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sFurnR = [
            "Furniture Repairs",
            { value: 'Polishing/Repainting', text: 'Polishing/Repainting' },
            { value: 'Door/Lock Fix', text: 'Door/Lock Fix' },
            { value: 'Kitchen Cabinet Repair', text: 'Kitchen Cabinet Repair' },
            { value: 'Joint Fabric Replacement', text: 'Joint Fabric Replacement' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        const sGen = [
            "Generator Fixes & Servicing",
            { value: 'Basic Servicing', text: 'Basic Servicing' },
            { value: 'Engine Repair', text: 'Engine Repair' },
            { value: 'Electrical Fault Fix', text: 'Electrical Fault Fix' },
            { value: 'Starter/Carburetor Fix', text: 'Starter/Carburetor Fix' },
            { value: 'Home Generator Installation', text: 'Home Generator Installation' },
            { value: 'Others', text: 'Others (Specify Below)' }
        ];

        let servv = [sMove, sPaint, sElec, sPlumb, sCurt, sClean, sAc, sSolar, sHome, sFurnM, sFurnR, sGen];

        function showSecondDropdown() {
            const selectedValue = document.getElementById('serv1').value;

            const dd2 = document.getElementById('serv2');

            const c2 = document.getElementById('serv2c');

            dd2.innerHTML = '<option value="">-- Select Service Description --</option>';

            if (selectedValue) {
                c2.style.display = 'block';
                for (let i = 0; i < servv.length; i++) {
                    if (selectedValue == servv[i][0]) {
                        
                        const remainingServices = servv[i].filter(service => service.value);

                        remainingServices.forEach(service => {
                            const option = document.createElement('option');
                            option.value = service.value;
                            option.textContent = service.text;
                            dd2.appendChild(option);
                        });
                    }
                }
            } else {
                c2.style.display = 'none';
            }
        }
    </script>

    <input type="submit" class="submit">
    </form>
    </div>

  </footer>
